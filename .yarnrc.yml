# Vite + native addons (sharp, esbuild) are happier with a real node_modules
# tree than Plug'n'Play. PnP is not used unless this is changed deliberately.
nodeLinker: node-modules

# Yarn 4.18 defaults enableScripts to false. sharp (tile-builder) and esbuild
# (Vite) need their postinstall binaries.
enableScripts: true
